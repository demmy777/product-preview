<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Product preview card component</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="md:w-[1440px] w-[375px] bg-[var(--Cream)]">
    <div
      class="md:w-[600px] w-[350px] mx-auto my-[100px] flex flex-col md:flex-row items-center"
    >
      <img
        src="./images/image-product-desktop.jpg"
        alt=""
        class="w-1/2 h-[450px] hidden md:block md:rounded-l-[10px]"
      />
      <img
        src="./images/image-product-mobile.jpg"
        alt=""
        class="full block md:hidden rounded-t-[10px]"
      />
      <!-- PERFUME INFO -->
      <div
        class="md:w-1/2 w-full h-[450px] bg-white p-7.5 flex flex-col justify-between text-sm rounded-bl-[10px] rounded-br-[10px] md:rounded-r-[10px] md:rounded-bl-none"
      >
        <p class="font-medium text-[var(--Grey)] tracking-[4px]">PERFUME</p>
        <h1 class="fam text-[30px] font-bold leading-none">
          Gabrielle Essence Eau <br />De Parfum
        </h1>
        <p class="mont text-[var(--Grey)] font-medium">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <!-- PRICE -->
        <div class="flex gap-5 items-center">
          <p class="fam text-3xl font-bold text-[#3C8067]">$149.99</p>
          <p class="line-through text-[#6C7289] font-medium">$169.99</p>
        </div>
        <!-- ADD TO CART BUTTON -->
        <div
          class="flex items-center justify-center bg-[#3C8067] gap-3 text-white p-3 font-semibold rounded-lg"
        >
          <img src="./images/icon-cart.svg" alt="" />
          <p>Add to Cart</p>
        </div>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
